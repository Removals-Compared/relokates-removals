<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Dashboard | Relokates Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/relokates-app-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Relokates Admin">
<meta name="theme-color" content="#1A3C6E">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A3C6E;--gold:#B8932A;--cream:#F4F8F6;--teal:#A8C5BC;--muted:#556070;--border:#c8ddd8}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#F4F6FA;font-family:Inter,Arial,sans-serif;color:#1f2937;min-height:100vh}
.bar{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.bar img{height:36px;width:auto}
.bar .title{font-family:Montserrat,sans-serif;font-weight:700;letter-spacing:0.5px}
.bar a.logout{color:rgba(255,255,255,.75);font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:6px}
.bar a.logout:hover{color:#fff;border-color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:24px}

/* stat cards */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;min-width:118px;flex:1;transition:border-color .12s,box-shadow .12s;user-select:none}
.stat:hover{border-color:var(--navy)}
.stat:focus-visible{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,60,110,.2)}
.stat.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,147,42,.2)}
.stat .n{font-family:Montserrat,sans-serif;font-size:24px;font-weight:800;color:var(--navy)}
.stat.s-won .n{color:#065F46}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:2px}

.controls{background:#fff;border-radius:12px;padding:16px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.controls input[type=search]{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:Inter,sans-serif}
.controls select{padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:Inter,sans-serif}
.controls input:focus,.controls select:focus{outline:none;border-color:var(--gold)}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-family:Montserrat,sans-serif;font-weight:700;color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.gold:hover{background:#A07F1E}
.btn.red{background:#b00020;color:#fff;border-color:#b00020}

.bulkbar{display:none;align-items:center;gap:14px;background:#fff8e6;border:1px solid #f0d97d;border-left:4px solid var(--gold);border-radius:10px;padding:10px 16px;margin-bottom:12px;flex-wrap:wrap}
.bulkbar.open{display:flex}
.bulkbar .cnt{font-weight:700;color:var(--navy);font-size:13px}

table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.04)}
thead th{background:var(--cream);text-align:left;padding:13px 14px;font-family:Montserrat,sans-serif;font-size:12px;color:var(--navy);letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--border)}
thead th.right{text-align:right}
thead th.cb-col{width:34px;text-align:center}
tbody td{padding:13px 14px;font-size:14px;border-bottom:1px solid #f0f3f8;vertical-align:top}
tbody td.right{text-align:right;font-family:Montserrat,sans-serif;font-weight:700;color:var(--navy)}
tbody td.cb-col{text-align:center}
tbody tr:hover{background:#FBFCFE;cursor:pointer}
tbody tr.selected{background:#fff8ef !important}
tbody tr:last-child td{border-bottom:none}
.sub{color:var(--muted);font-size:12px}
#rows input[type=checkbox]{width:16px;height:16px;cursor:pointer}

.tel-link{color:var(--gold);text-decoration:none;font-weight:700;white-space:nowrap}
.tel-link:hover{text-decoration:underline}
.tel-icon{display:none}

.pill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 10px;border-radius:99px;font-family:Montserrat,sans-serif;white-space:nowrap}
.pill.new{background:#E0F2FE;color:#075985}
.pill.accepted{background:#D1FAE5;color:#047857}
.pill.contacted{background:#FEF3C7;color:#92400E}
.pill.quote_sent{background:#e0e7ff;color:#4338ca}
.pill.prospecting{background:#ccfbf1;color:#0f766e}
.pill.survey_booked{background:#DDD6FE;color:#5B21B6}
.pill.move_booked{background:#D1FAE5;color:#065F46}
.pill.won{background:#A7F3D0;color:#064E3B}
.pill.lost{background:#F1F5F9;color:#475569}

.rem-badge{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:#0f766e;background:#f0fdfa;border:1px solid #99f6e4;border-radius:6px;padding:2px 8px}
.rem-badge.due{color:#b91c1c;background:#fef2f2;border-color:#fecaca}

button.del{background:transparent;color:#9CA3AF;border:none;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:16px;line-height:1;transition:all .12s}
button.del:hover{background:#FEF2F2;color:#991B1B}
td.actions{text-align:right;padding:8px 12px !important}
.empty{padding:48px;text-align:center;color:var(--muted)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:28px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto}
.modal h3{font-family:Montserrat,sans-serif;color:var(--navy);margin:0 0 4px;font-size:18px}
.modal p.muted{color:var(--muted);font-size:13px;margin:0 0 16px}
.modal label{display:block;font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);margin:12px 0 6px;font-weight:700}
.modal input,.modal select,.modal textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:Inter,sans-serif;box-sizing:border-box}
.modal textarea{min-height:60px;resize:vertical}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--gold)}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.flash{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px;display:none}
.flash.ok{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7;display:block}
.flash.err{background:#FEF2F2;color:#991B1B;border:1px solid #FCA5A5;display:block}

/* staff role: hide money + destructive controls */
body.staff td.right,body.staff th.right{display:none !important}
body.staff .staff-hide{display:none !important}
body.staff .del,body.staff .bulkbar,body.staff td.cb-col,body.staff th.cb-col,body.staff #binLink{display:none !important}
/* identity chip */
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:3px 12px 3px 3px;color:#fff;font-size:13px;font-weight:600}
.chip .ava{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-family:Montserrat,sans-serif;overflow:hidden;cursor:pointer;flex:0 0 auto}
.chip .ava img{width:100%;height:100%;object-fit:cover}
/* today panel */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.today .tcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.today .tcard h3{font-family:Montserrat,sans-serif;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--navy);margin:0 0 10px}
.today .ti{font-size:13px;padding:6px 0;border-bottom:1px solid #f0f3f8;cursor:pointer}
.today .ti:last-child{border-bottom:none}
.today .ti .n{font-weight:600}
.today .ti .s{color:var(--muted);font-size:12px}
.today .none{color:var(--muted);font-size:13px}

@media(max-width:760px){
  .today{grid-template-columns:1fr}
  .wrap{padding:14px 12px}
  .stats{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .stat{min-width:96px;flex:0 0 auto;padding:10px 12px}
  .stat .n{font-size:20px}
  .controls input[type=search]{min-width:0;width:100%;flex:1 0 100%}
  thead th,tbody td{padding:9px 6px;font-size:12.5px}
  .tel-num{display:none}
  .tel-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#fff7ec;color:var(--gold)}
  th:nth-child(6),td:nth-child(6){text-align:center;width:46px}
  /* keep Name, Status, Move date, Phone, delete; tap row for the rest */
  th:nth-child(1),td:nth-child(1),
  th:nth-child(5),td:nth-child(5),
  th:nth-child(7),td:nth-child(7),
  th:nth-child(8),td:nth-child(8),
  th:nth-child(9),td:nth-child(9){display:none}
}
</style>
</head>
<body>
<div class="bar">
  <div style="display:flex;align-items:center;gap:14px">
    <img src="/images/logo.webp" alt="Relokates">
    <span class="title">Admin / Quotes</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="chipSlot"></span>
    <a href="#" class="logout" id="logoutBtn">Sign out</a>
  </div>
</div>

<div class="wrap">
  <div class="today" id="today" style="display:none"></div>
  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="search" id="search" placeholder="Search name, email or phone...">
    <select id="filter">
      <option value="all" selected>All statuses</option>
      <option value="new">New</option>
      <option value="accepted">Accepted</option>
      <option value="contacted">Contacted</option>
      <option value="quote_sent">Quote Sent</option>
      <option value="prospecting">Prospecting</option>
      <option value="survey_booked">Survey booked</option>
      <option value="move_booked">Move booked</option>
      <option value="won">Completed</option>
      <option value="lost">Lost</option>
    </select>
    <a class="btn" href="/admin/overview" style="text-decoration:none;display:inline-flex;align-items:center">&#128202; Overview</a>
    <a class="btn" id="binLink" href="/admin/deleted" style="text-decoration:none;display:inline-flex;align-items:center">&#128465; Recycle bin</a>
    <button class="btn navy" id="refreshBtn">Refresh</button>
    <button class="btn gold" id="addBtn">+ Add customer</button>
  </div>

  <div class="bulkbar" id="bulkBar">
    <span class="cnt"><strong id="bulkCount">0</strong> selected</span>
    <button class="btn" id="bulkClear">Clear</button>
    <button class="btn red" id="bulkDelete">&#128465; Delete selected</button>
  </div>

  <table>
    <thead>
      <tr>
        <th class="cb-col"><input type="checkbox" id="selectAll" title="Select all"></th>
        <th>Name</th>
        <th>Status</th>
        <th>Move date</th>
        <th>Received</th>
        <th>Phone</th>
        <th>Service</th>
        <th>From / To</th>
        <th class="right">Value</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="10" class="empty">Loading...</td></tr></tbody>
  </table>
</div>

<!-- Add customer modal -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>Add a customer</h3>
    <p class="muted">For customers who called or walked in instead of using the public form. Creates a new quote with status "new".</p>
    <form id="addForm">
      <div class="row">
        <div><label>Name *</label><input type="text" name="name" required></div>
        <div><label>Phone</label><input type="tel" name="phone" placeholder="07700 000000"></div>
      </div>
      <label>Email</label>
      <input type="email" name="email" placeholder="customer@example.com">
      <p class="muted" style="margin:4px 0 0">Phone OR email is required.</p>
      <label>Service</label>
      <select name="service">
        <option value="">Choose a service</option>
        <option value="House Removal">House Removal</option>
        <option value="Office Removal">Office Removal</option>
        <option value="International Removal - Dubai">International Removal - Dubai</option>
        <option value="International Removal - Other">International Removal - Other</option>
        <option value="Packing Service">Packing Service</option>
        <option value="Man and Van">Man and Van</option>
        <option value="Secure Storage">Secure Storage</option>
        <option value="Luxury Removals">Luxury Removals</option>
        <option value="House Clearance">House Clearance</option>
      </select>
      <div class="row">
        <div><label>Moving from</label><input type="text" name="move_from" placeholder="e.g. Chelmsford CM1"></div>
        <div><label>Moving to</label><input type="text" name="move_to" placeholder="e.g. Bromley BR1"></div>
      </div>
      <div class="row">
        <div><label>Preferred move date</label><input type="date" name="move_date"></div>
        <div><label>Property type</label>
          <select name="property">
            <option value="">Choose</option>
            <option value="Studio / 1-bed flat">Studio / 1-bed flat</option>
            <option value="2-bed flat">2-bed flat</option>
            <option value="3-bed house">3-bed house</option>
            <option value="4-bed house">4-bed house</option>
            <option value="5+ bed house">5+ bed house</option>
            <option value="Office">Office</option>
            <option value="Storage">Storage</option>
          </select>
        </div>
      </div>
      <label>Quoted value (GBP)</label>
      <input type="number" name="value" min="0" step="1" placeholder="e.g. 850">
      <label>Notes / message</label>
      <textarea name="message" placeholder="What did they ask for? Special items, access notes..."></textarea>
      <div class="flash" id="addFlash"></div>
      <div class="footer">
        <button type="button" class="btn" id="addCancel">Close</button>
        <button class="btn gold" type="submit" id="addSubmit">Add customer</button>
      </div>
    </form>
  </div>
</div>

<script>
// Stat cards, in dashboard order. "won" is shown as Completed.
const STATUSES = [
  ['all','All'], ['new','New'], ['accepted','Accepted'], ['contacted','Contacted'], ['quote_sent','Quote Sent'],
  ['prospecting','Prospecting'], ['survey_booked','Survey booked'], ['move_booked','Move booked'], ['won','Completed'],
];
const labelFor = (s) => ({
  new:'New', accepted:'Accepted', contacted:'Contacted', quote_sent:'Quote Sent', prospecting:'Prospecting',
  survey_booked:'Survey booked', move_booked:'Move booked', won:'Completed', lost:'Lost',
}[s] || s || 'New');

// Pipeline order: new first, then move booked (soonest first), survey booked,
// prospecting, quote sent, contacted, completed, lost. Array.sort is stable, so
// the fetched newest-first order is kept within each group.
const STATUS_RANK = { new:0, accepted:1, move_booked:2, survey_booked:3, prospecting:4, quote_sent:5, contacted:6, won:7, lost:8 };
function sortLeads(rows){
  const md = (r) => ((r.move_date || '').slice(0,10)) || '9999-99-99';
  const rank = (r) => STATUS_RANK[r.status] ?? 0;
  return rows.slice().sort((a,b) => {
    if (rank(a) !== rank(b)) return rank(a) - rank(b);
    if (a.status === 'move_booked' && b.status === 'move_booked') return md(a) < md(b) ? -1 : md(a) > md(b) ? 1 : 0;
    return 0;
  });
}

let activeStatus = 'all';
let allRows = [];
let myRole = 'admin';
const selected = new Set();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let timer;

function fmtDate(v){ if(!v) return '-'; try{ return new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch{ return v; } }
function fmtMoney(v){ return (v===null||v===undefined||v==='') ? '-' : '£'+Number(v).toLocaleString('en-GB'); }

async function api(url, opts){
  const r = await fetch(url, opts);
  if (r.status === 401){ window.location.href = '/admin'; throw new Error('unauth'); }
  return r;
}

async function load(){
  const search = $('search').value.trim();
  const params = new URLSearchParams();
  if (activeStatus !== 'all') params.set('status', activeStatus);
  if (search) params.set('search', search);
  $('rows').innerHTML = '<tr><td colspan="10" class="empty">Loading...</td></tr>';
  try {
    const r = await api('/api/admin/quotes?' + params);
    const data = await r.json();
    myRole = data.role || 'admin';
    document.body.classList.toggle('staff', myRole === 'staff');
    showChip(data.display_name || 'Admin');
    allRows = sortLeads(data.quotes || []);
    renderRows(allRows);
    renderToday(allRows);
    renderStats();
  } catch (e) {
    if (String(e.message) !== 'unauth') $('rows').innerHTML = '<tr><td colspan="10" class="empty">Could not load leads.</td></tr>';
  }
}

// Counts come from a separate unfiltered fetch so they stay stable (true totals)
// even while a status filter or search is active.
async function renderStats(){
  let rows = allRows;
  if (activeStatus !== 'all' || $('search').value.trim()) {
    try { rows = (await (await api('/api/admin/quotes')).json()).quotes || []; } catch { rows = allRows; }
  }
  const counts = { all: rows.length };
  rows.forEach((r) => { const s = r.status || 'new'; counts[s] = (counts[s]||0)+1; });
  $('stats').innerHTML = STATUSES.map(([key,label]) => `
    <div class="stat ${key==='won'?'s-won':''} ${activeStatus===key?'active':''}" data-status="${key}" role="button" tabindex="0" aria-label="Show ${label} quotes">
      <div class="n">${counts[key]||0}</div><div class="l">${label}</div>
    </div>`).join('');
  document.querySelectorAll('.stat').forEach((el) => {
    const go = () => { activeStatus = el.dataset.status; $('filter').value = activeStatus; load(); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

function renderRows(rows){
  selected.clear(); updateBulkBar();
  if ($('selectAll')) $('selectAll').checked = false;
  if (!rows.length){ $('rows').innerHTML = '<tr><td colspan="10" class="empty">No leads match the current filter.</td></tr>'; return; }
  const today = new Date().toISOString().slice(0,10);
  $('rows').innerHTML = rows.map((r) => {
    const st = r.status || 'new';
    const rem = r.reminder;
    const remHtml = rem
      ? `<div class="rem-badge ${rem.remind_on <= today ? 'due' : ''}">&#128222; Call ${fmtDate(rem.remind_on)}${rem.remind_time ? ' ' + esc(rem.remind_time) : ''}${rem.note ? ' &middot; ' + esc(rem.note) : ''}</div>`
      : '';
    const tel = r.phone
      ? `<a class="tel-link" href="tel:${esc(String(r.phone).replace(/[^\d+]/g,''))}" aria-label="Call ${esc(r.phone)}"><span class="tel-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/></svg></span><span class="tel-num">${esc(r.phone)}</span></a>`
      : '-';
    return `<tr data-id="${esc(r.id)}" data-name="${esc(r.name)}">
      <td class="cb-col"><input type="checkbox" class="row-cb" data-id="${esc(r.id)}"></td>
      <td><strong>${esc(r.name||'-')}</strong><div class="sub">${esc(r.email||'')}</div>${remHtml}</td>
      <td><span class="pill ${st}">${labelFor(st)}</span></td>
      <td>${fmtDate(r.move_date)}</td>
      <td>${fmtDate(r.created_at)}</td>
      <td>${tel}</td>
      <td>${esc(r.service||'-')}</td>
      <td>${esc(r.move_from||'-')} <span class="sub">&rarr;</span> ${esc(r.move_to||'-')}</td>
      <td class="right">${fmtMoney(r.value)}</td>
      <td class="actions"><button class="del" data-action="delete" title="Delete this lead">&#128465;</button></td>
    </tr>`;
  }).join('');

  document.querySelectorAll('#rows tr[data-id]').forEach((tr) => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="delete"]') || e.target.closest('.row-cb') || e.target.closest('.tel-link')) return;
      window.location.href = '/admin/quote/' + tr.dataset.id;
    });
  });
  document.querySelectorAll('.row-cb').forEach((cb) => {
    cb.addEventListener('click', (e) => e.stopPropagation());
    cb.addEventListener('change', (e) => {
      const id = e.target.dataset.id;
      const tr = e.target.closest('tr');
      if (e.target.checked){ selected.add(id); tr.classList.add('selected'); }
      else { selected.delete(id); tr.classList.remove('selected'); }
      const all = document.querySelectorAll('.row-cb');
      if ($('selectAll')) $('selectAll').checked = selected.size === all.length && all.length > 0;
      updateBulkBar();
    });
  });
  document.querySelectorAll('[data-action="delete"]').forEach((b) => {
    b.addEventListener('click', async (e) => {
      e.stopPropagation();
      const tr = e.target.closest('tr');
      const id = tr.dataset.id;
      if (!confirm(`Move "${tr.dataset.name}" to the recycle bin?\n\nYou can restore it within 30 days.`)) return;
      try {
        const r = await api('/api/admin/quote/' + encodeURIComponent(id), { method:'DELETE' });
        if (r.ok){ tr.style.opacity = '.3'; tr.style.pointerEvents = 'none'; setTimeout(load, 250); }
        else { const d = await r.json().catch(()=>({})); alert('Delete failed: ' + (d.error || r.status)); }
      } catch {}
    });
  });
}

function updateBulkBar(){
  $('bulkCount').textContent = selected.size;
  $('bulkBar').classList.toggle('open', selected.size > 0);
}

// Identity chip: initials avatar (or a locally-stored photo). Tap the avatar to
// set a photo; it is saved in this browser only (localStorage), never uploaded.
function showChip(name){
  const slot = $('chipSlot'); if (!slot) return;
  const initials = String(name||'Admin').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || 'A';
  const key = 'rlk_avatar_' + String(name||'admin').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const saved = (()=>{ try { return localStorage.getItem(key); } catch { return null; } })();
  slot.innerHTML = `<span class="chip"><span class="ava" id="chipAva" title="Tap to set a photo">${saved?`<img src="${saved}" alt="">`:esc(initials)}</span>${esc(name||'Admin')}</span>`;
  const ava = $('chipAva');
  ava.addEventListener('click', () => {
    const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      const img = new Image(); const rd = new FileReader();
      rd.onload = () => { img.onload = () => {
        const c = document.createElement('canvas'); c.width=128; c.height=128;
        const ctx=c.getContext('2d'); const s=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);
        const data=c.toDataURL('image/jpeg',0.85);
        try { localStorage.setItem(key,data); } catch {}
        ava.innerHTML=`<img src="${data}" alt="">`;
      }; img.src=rd.result; };
      rd.readAsDataURL(f);
    });
    inp.click();
  });
}

// "Today" panel: what needs attention right now.
function renderToday(rows){
  const el = $('today'); if (!el) return;
  const today = new Date().toISOString().slice(0,10);
  const moving = rows.filter(r => r.status==='move_booked' && (r.move_date||'').slice(0,10)===today);
  const calls = rows.filter(r => r.reminder && r.reminder.remind_on <= today);
  const chase = rows.filter(r => r.status==='quote_sent' && r.created_at && (Date.now()-new Date(r.created_at).getTime()) > 7*86400000);
  const card = (icon,title,items,fmt) => {
    const shown = items.slice(0,3).map(fmt).join('');
    const more = items.length>3 ? `<div class="s">+${items.length-3} more</div>` : '';
    return `<div class="tcard"><h3>${icon} ${title} (${items.length})</h3>${items.length?shown+more:'<div class="none">Nothing today</div>'}</div>`;
  };
  const row = (r,sub) => `<div class="ti" onclick="location.href='/admin/quote/${esc(r.id)}'"><span class="n">${esc(r.name||'-')}</span><div class="s">${sub}</div></div>`;
  el.innerHTML =
    card('&#128667;','Moving today',moving,r=>row(r,`${esc(r.move_from||'-')} to ${esc(r.move_to||'-')}`)) +
    card('&#128222;','Calls due',calls,r=>row(r,r.reminder&&r.reminder.note?esc(r.reminder.note):'Call back')) +
    card('&#8987;','Quotes to chase',chase,r=>row(r,'Quote sent '+fmtDate(r.created_at)));
  el.style.display='';
}

$('selectAll').addEventListener('change', (e) => {
  document.querySelectorAll('.row-cb').forEach((cb) => {
    cb.checked = e.target.checked;
    const tr = cb.closest('tr');
    if (e.target.checked){ selected.add(cb.dataset.id); tr.classList.add('selected'); }
    else { selected.delete(cb.dataset.id); tr.classList.remove('selected'); }
  });
  updateBulkBar();
});
$('bulkClear').addEventListener('click', () => {
  selected.clear();
  document.querySelectorAll('.row-cb').forEach((cb) => { cb.checked = false; cb.closest('tr').classList.remove('selected'); });
  $('selectAll').checked = false;
  updateBulkBar();
});
$('bulkDelete').addEventListener('click', async () => {
  const ids = [...selected];
  if (!ids.length) return;
  if (!confirm('Move ' + ids.length + ' lead' + (ids.length>1?'s':'') + ' to the recycle bin? You can restore them within 30 days.')) return;
  const btn = $('bulkDelete'); btn.disabled = true; btn.textContent = 'Deleting...';
  const results = await Promise.allSettled(ids.map((id) => api('/api/admin/quote/' + encodeURIComponent(id), { method:'DELETE' })));
  const failed = results.filter((r) => r.status === 'rejected' || (r.value && !r.value.ok)).length;
  btn.disabled = false; btn.textContent = '\u{1F5D1} Delete selected';
  if (failed) alert(failed + ' of ' + ids.length + ' could not be deleted. The rest were removed.');
  selected.clear();
  load();
});

// Add customer modal
const addModal = $('addModal');
$('addBtn').addEventListener('click', () => { $('addForm').reset(); $('addFlash').className = 'flash'; addModal.classList.add('open'); });
$('addCancel').addEventListener('click', () => addModal.classList.remove('open'));
addModal.addEventListener('click', (e) => { if (e.target.id === 'addModal') addModal.classList.remove('open'); });
$('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  if (!String(data.phone||'').trim() && !String(data.email||'').trim()){
    $('addFlash').textContent = 'Phone OR email is required.'; $('addFlash').className = 'flash err'; return;
  }
  const btn = $('addSubmit'); btn.disabled = true; btn.textContent = 'Adding...';
  try {
    const r = await api('/api/admin/customer', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok){ $('addFlash').textContent = d.error || 'Failed to add customer'; $('addFlash').className = 'flash err'; return; }
    $('addFlash').textContent = 'Customer added.'; $('addFlash').className = 'flash ok';
    setTimeout(() => { if (d.quote && d.quote.id) window.location.href = '/admin/quote/' + d.quote.id; else { addModal.classList.remove('open'); load(); } }, 500);
  } catch { $('addFlash').textContent = 'Network error - try again.'; $('addFlash').className = 'flash err'; }
  finally { btn.disabled = false; btn.textContent = 'Add customer'; }
});

// Controls
$('search').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 300); });
$('filter').addEventListener('change', (e) => { activeStatus = e.target.value; load(); });
$('refreshBtn').addEventListener('click', load);
$('logoutBtn').addEventListener('click', async (e) => { e.preventDefault(); await fetch('/api/admin/login', { method:'DELETE' }); window.location.href = '/admin'; });

load();
</script>
