<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birmingham Branch — Relokates Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#A8C5BC;--gold:#B8932A;--navy:#1A3C6E;--cream:#F4F8F6;--muted:#556070;--border:#c8ddd8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:36px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(26,60,110,.1)}
.card img{height:56px;margin:0 auto 14px;display:block}
h1{font-family:'Montserrat',sans-serif;font-size:19px;color:var(--navy);text-align:center;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:22px;line-height:1.6}
label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;font-family:'Montserrat',sans-serif}
input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:'Inter',sans-serif}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,147,42,.15)}
button{display:block;width:100%;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;padding:13px 24px;border-radius:8px;border:none;cursor:pointer;background:var(--gold);color:#fff;margin-top:16px}
button:hover{background:#9a7820}
.err{display:none;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:12px 16px;font-size:13px;color:#991b1b;margin-top:14px}
.foot{font-size:11px;color:#9aa;text-align:center;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <img src="/images/logo.webp" alt="Relokates Removals">
  <h1>Birmingham Branch</h1>
  <p class="sub">Branch sign-in for Richard Jones. You'll get the full Relokates dashboard - leads, quotes, bookings and documents - showing Birmingham enquiries only.</p>
  <form id="login-form">
    <label for="pw">Branch password</label>
    <input type="password" id="pw" required autocomplete="current-password">
    <button type="submit">Sign in</button>
    <div class="err" id="err">That password wasn't recognised. Try again.</div>
  </form>
  <p class="foot">Relokates Removals Birmingham &middot; 07947 229838<br>birmingham@relokates.co.uk</p>
</div>
<script>
// Already signed in? Straight to the dashboard.
fetch('/api/admin/quotes?branch=birmingham').then(function(r){ if (r.ok) window.location.href='/admin/dashboard'; });
document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  document.getElementById('err').style.display='none';
  var res = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (!res.ok) { document.getElementById('err').style.display='block'; return; }
  window.location.href = '/admin/dashboard';
});
</script>
</body>
</html>
